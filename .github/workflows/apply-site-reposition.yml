name: Apply founder and Density site reposition

on:
  push:
    branches:
      - site/founder-density-reposition-2026-09-16
    paths:
      - .github/workflows/apply-site-reposition.yml

permissions:
  contents: write

jobs:
  apply-site-reposition:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Decode and apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d scripts/site_reposition.patch.gz.b64 | gzip -d > /tmp/site-reposition.patch
          git apply -p5 --whitespace=nowarn /tmp/site-reposition.patch
          git status --short

      - name: Commit founder/Density reposition
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html work/index.html research/index.html patents/index.html site.webmanifest DEPLOYMENT.md LAUNCH_CHECKLIST.md LAUNCH_STATUS.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Reposition public site around founder story and Density"
          git push origin HEAD:${GITHUB_REF_NAME}
